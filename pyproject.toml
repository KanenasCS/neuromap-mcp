[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azure-neuromap-mcp"
version = "0.3.8"
description = "Read-only MCP server that maps every Azure resource, its connections, network access and RBAC as a precise graph"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Konstantinos Lianos" }]
keywords = ["azure", "security", "mcp", "network", "rbac", "sentinel", "attack-surface"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = ["mcp>=2.2,<3", "azure-identity>=1.17", "httpx>=0.27", "anyio>=4"]

[project.scripts]
neuromap-mcp = "neuromap.server:main"
neuromap = "neuromap.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neuromap"]

[project.urls]
Homepage = "https://github.com/KanenasCS/azure-neuromap-mcp"
Issues = "https://github.com/KanenasCS/azure-neuromap-mcp/issues"
Changelog = "https://github.com/KanenasCS/azure-neuromap-mcp/blob/main/CHANGELOG.md"
